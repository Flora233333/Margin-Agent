# 整套服务，在 WSL 里运行（Docker 只装在 WSL）：
#   wsl -d Ubuntu-22.04 -- bash -lc "cd /mnt/d/competition/margin-agent && docker compose up -d --build --wait"
# 端口只映射到 127.0.0.1，Windows 上的浏览器 / Python / 测试通过 localhost 连接。
#
#   基础服务  postgres、rabbitmq、redis、embedding（官方镜像）
#   应用服务  migrate（执行迁移后退出）、api、worker、dispatcher（同一个应用镜像，命令不同）

# 应用服务的公共配置（YAML 锚点 &app，下面用 <<: *app 引用，避免抄四遍）
x-app: &app
  build: .
  image: margin-app
  restart: unless-stopped
  # 模型网关地址和密钥来自 .env（不进镜像、不进仓库）
  env_file: .env
  # 下面这些覆盖 .env 里的同名项：容器里的主机名和路径与 Windows 上不同
  environment:
    MARGIN_DATABASE_URL: postgresql://margin:${MARGIN_PG_PASSWORD:-margin_dev}@postgres:5432/margin
    MARGIN_REDIS_URL: redis://redis:6379/0
    MARGIN_BROKER_URL: amqp://margin:${MARGIN_MQ_PASSWORD:-margin_dev}@rabbitmq:5672//
    MARGIN_EMBEDDING_BASE_URL: http://embedding:8080/v1
    MARGIN_BLOCKS_PATH: /data/blocks/blocks.jsonl
    MARGIN_MANIFEST_PATH: /data/canonical/h1.1.0-rc/manifest.json
    MARGIN_ALIAS_PATH: /data/canonical/h1.1.0-rc/entity_alias_catalog.jsonl
    MARGIN_CACHE_DIR: /app/.cache

services:
  postgres:
    # 官方 PostgreSQL 18 镜像 + 预装 pgvector 扩展（向量列类型和余弦距离运算符）
    image: pgvector/pgvector:pg18
    restart: unless-stopped  # WSL 重启后 Docker 会自动把它拉起来
    environment:
      POSTGRES_DB: margin
      POSTGRES_USER: margin
      # 开发库密码；compose 会从同目录 .env 读取 MARGIN_PG_PASSWORD，没有就用 margin_dev
      POSTGRES_PASSWORD: ${MARGIN_PG_PASSWORD:-margin_dev}
    ports:
      - "127.0.0.1:5432:5432"  # 只绑本机，不暴露到局域网
    volumes:
      # PG 18 镜像的数据目录是 /var/lib/postgresql（18 起不再是 .../data）；
      # 用命名卷保存数据，容器删了数据还在
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin -d margin"]
      interval: 5s
      timeout: 3s
      retries: 10

  embedding:
    # llama.cpp 官方 CPU 版服务镜像，只给“查询”算向量（文档向量已在 PG 里）。
    # 用摘要（digest）固定版本：标签 server 会随上游更新，摘要不会。对应 build 11371。
    image: ghcr.io/ggml-org/llama.cpp@sha256:460ff87b6dfd6b9e8ee0f4018540e007eb333a574994033b70dd6be46069de01
    restart: unless-stopped
    # 参数与 RC6-C 的索引 rc6-local-qwen3emb06b-q8_0-v2 保持一致，改了就和库里的文档向量对不上：
    #   --pooling last        Qwen3-Embedding 取最后一个 token 的隐藏状态作为整句向量
    #   --embd-normalize 2    L2 归一化（向量长度为 1），余弦相似度 = 点积
    #   -c / -b / -ub 8192    一段输入必须整段放进一个批次；默认 512 会拒绝长文本
    #   --alias               对外的模型名，和索引记录的名字相同
    command: >
      -m /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      --embedding --pooling last --embd-normalize 2
      -c 8192 -b 8192 -ub 8192 --threads 8
      --host 0.0.0.0 --port 8080 --alias rc6-local-qwen3emb06b-q8_0-v2
    volumes:
      # 模型只有一份，放在仓库的 models/（不进 git），只读挂载进容器，不复制
      - ./models:/models:ro
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    # Celery 的消息队列（broker，D19）。带 management 的镜像自带管理界面：
    # 浏览器打开 http://127.0.0.1:15672 能看到队列里有几条消息、几个消费者、每个消费者预取了几条
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    # 固定主机名：RabbitMQ 的节点名是 rabbit@<主机名>，数据目录也按节点名区分。
    # 不固定的话每次重建容器主机名都会变（默认是随机的容器 id），重启后就“找不到”旧的队列和消息
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: margin
      RABBITMQ_DEFAULT_PASS: ${MARGIN_MQ_PASSWORD:-margin_dev}
    ports:
      - "127.0.0.1:5672:5672"    # AMQP：dispatcher 发消息、worker 收消息
      - "127.0.0.1:15672:15672"  # 管理界面（用户名 margin，密码同上）
    volumes:
      # 队列和持久化消息存在这里；容器删了、重启了，消息还在
      - rabbitmqdata:/var/lib/rabbitmq
      # 确认期限 consumer_timeout 设为 1 小时，原因见文件里的注释
      - ./deploy/rabbitmq/margin.conf:/etc/rabbitmq/conf.d/20-margin.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # M2 起用于实时推送思考片段（不再是任务队列，任务队列在 rabbitmq）
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    # 一次性任务：把数据库结构升级到最新版本后退出；api / worker / dispatcher 等它成功再启动
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: uvicorn margin.api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    # 4 个子进程 = 最多同时执行 4 道题；扩容就多开几个 worker 容器
    command: celery -A margin.worker worker --concurrency 4 --loglevel INFO
    volumes:
      # 语料只读挂载（不复制进镜像）；BM25 缓存和 Windows 上共用一份，不用在容器里重建
      - ../finetune/data:/data:ro
      - ./.cache/bm25:/app/.cache/bm25
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      embedding:
        condition: service_healthy

  dispatcher:
    <<: *app
    command: python -m margin.dispatcher
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmqdata:
