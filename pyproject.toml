[project]
name = "margin-agent"
version = "0.1.0"
description = "Margin：可追溯证据的金融长文档 Agent 服务"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # 工具参数校验（模型传来的 JSON 参数先过 Pydantic，再执行工具）
    "pydantic>=2.7",
    # 调用 OpenAI 兼容的模型接口与 embedding 接口
    "httpx>=0.27",
    # 中文分词，BM25 检索用
    "jieba>=0.42",
    # BM25 打分用的稀疏矩阵运算
    "numpy>=1.26",
    "scipy>=1.11",
    # PostgreSQL 驱动（psycopg 3；binary 版自带 libpq，Windows 上不用另装客户端）
    "psycopg[binary]>=3.2",
    # 让 SQLAlchemy 认识 pgvector 的 vector 列类型和余弦距离运算
    "pgvector>=0.4",
    # 统一读配置：环境变量 / .env -> 有类型的 Settings 对象（D18）
    "pydantic-settings>=2.4",
    # ORM + 连接池；Alembic 管数据库结构的版本（迁移脚本）
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # HTTP 接口；uvicorn 是运行它的 ASGI 服务器
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 后台任务队列，Redis 作消息中间件（broker）
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
# 只在一次性导入向量时用：从 RC6-C 的 Chroma 索引读出向量，写进 PostgreSQL（D15）。
dense = ["chromadb==1.5.9"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 集成测试要先起 PG（docker compose up -d postgres），默认跳过；用 pytest -m integration 单独跑
markers = ["integration: 需要真实 PostgreSQL / Redis"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
