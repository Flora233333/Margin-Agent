[project]
name = "margin-agent"
version = "0.1.0"
description = "Margin：可追溯证据的金融长文档 Agent 服务"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # 工具参数校验（模型传来的 JSON 参数先过 Pydantic，再执行工具）
    "pydantic>=2.7",
    # 调用 OpenAI 兼容的模型接口与 embedding 接口
    "httpx>=0.27",
    # 中文分词，BM25 检索用
    "jieba>=0.42",
    # BM25 打分用的稀疏矩阵运算
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# 向量检索是可选的第三路：没有 embedding 服务时只用 BM25 + 别名两路。
dense = ["chromadb==1.5.9"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
