# RabbitMQ 的补充配置，compose 挂载到 /etc/rabbitmq/conf.d/20-margin.conf。
# conf.d 里的文件按文件名顺序加载，后加载的覆盖先加载的（镜像自带的是 10-defaults.conf）。

# 确认期限（毫秒）：消费者拿到一条消息后，超过这个时间还没确认（ack），RabbitMQ 认为它出了问题，
# 关闭它所在的整个通道，通道上所有未确认的消息都回到队列。
# worker 是“执行完才确认”（acks_late），所以这个期限必须大于任务最长执行时间，保证正常执行永远不会触发它。
# 超时分层：模型调用 180 秒 < Celery 硬时限 25 分钟 < 确认期限 1 小时（RabbitMQ 4 默认 30 分钟）。
consumer_timeout = 3600000
